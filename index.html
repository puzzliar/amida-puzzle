<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>削減アミダクジ PUZZLE</title>
<meta name="description" content="リアル交渉ゲーム「削減アミダクジ」から生まれたパズル。どの横線を消せば、中央までのルートが最短になるか。">
<meta name="theme-color" content="#0a0a09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="アミダPUZZLE">
<meta property="og:title" content="削減アミダクジ PUZZLE">
<meta property="og:description" content="どの横線を消せば、最短ルートになる？ 放射状アミダクジの最短ルートパズル。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg0:#0a0a09;--bg1:#141412;--bg2:#1e1e1c;--bg3:#282826;--border:#333330;--border2:#444441;
  --text0:#f0ede6;--text1:#b8b5ae;--text2:#6a6864;
  --red:#e24b4a;--red-dim:#4a1a1a;--green:#5dcaa5;--gold:#ef9f27;--gold-dim:#3a2406;--purple:#9f8fef;
  --serif:'Hiragino Mincho ProN','Hiragino Mincho Pro',YuMincho,'Yu Mincho','Noto Serif JP',serif;
  --sans:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg0);color:var(--text0);font-family:var(--sans);overscroll-behavior:none}
body{
  background:radial-gradient(ellipse 80% 45% at 50% 0,rgba(60,40,15,.22) 0,transparent 60%),
             radial-gradient(ellipse 80% 45% at 50% 100%,rgba(60,40,15,.18) 0,transparent 60%),var(--bg0);
  min-height:100dvh;touch-action:manipulation;user-select:none;-webkit-user-select:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
.screen{display:none;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px);flex-direction:column}
.screen.active{display:flex}
.serif{font-family:var(--serif)}
.btn{display:block;width:100%;padding:14px 16px;border:1px solid var(--border2);background:var(--bg1);border-radius:10px;font-size:16px;letter-spacing:.08em;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98);background:var(--bg2)}
.btn.primary{background:linear-gradient(180deg,#f4ad3d,#d6881a);color:#1a1004;border-color:#f4ad3d;font-weight:700}
.btn.small{padding:8px 12px;font-size:13px;width:auto;border-radius:8px}
.btn .desc{display:block;font-size:11px;font-weight:400;letter-spacing:.02em;opacity:.75;margin-top:3px}
.row{display:flex;gap:8px}
.row>*{flex:1;width:auto}
b.gold,.gold{color:var(--gold)} b.red,.red{color:var(--red)}
.tag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:10px;margin-right:4px;letter-spacing:.05em;vertical-align:1px}
.tag.official{background:var(--gold-dim);color:var(--gold);border:1px solid #6a4410}
.tag.ref{background:var(--bg3);color:var(--text1);border:1px solid var(--border2)}

/* タイトル */
#title{align-items:center;justify-content:center;text-align:center;gap:22px}
.logo-kicker{font-size:12px;letter-spacing:.4em;color:var(--gold)}
.logo{font-family:var(--serif);font-size:clamp(34px,11vw,52px);letter-spacing:.12em;line-height:1.2;font-weight:600}
.logo small{display:block;font-size:.36em;letter-spacing:.6em;color:var(--red);margin-top:6px}
.title-svg{width:min(52vw,240px);aspect-ratio:1;opacity:.95}
.title-menu{width:min(100%,340px);display:flex;flex-direction:column;gap:10px}
.credit{font-size:11px;color:var(--text2);letter-spacing:.1em;line-height:1.8}
.credit a{color:var(--text1)}

.lang-switch{align-self:flex-end;margin-bottom:-8px;display:flex;border:1px solid var(--border2);border-radius:18px;overflow:hidden;font-size:12px}
.lang-switch button{padding:6px 12px;color:var(--text1)}
.lang-switch button.on{background:var(--gold);color:#1a1004;font-weight:700}
:root:lang(en) .logo{font-size:clamp(28px,9.5vw,44px);letter-spacing:.08em}

/* ヘッダー */
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.topbar h2{flex:1;font-family:var(--serif);font-size:20px;letter-spacing:.1em}
.back{width:40px;height:40px;border:1px solid var(--border);border-radius:50%;font-size:18px;flex:none}
.life-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;margin:8px 0 2px;border:1px solid var(--border);background:var(--bg1);border-radius:10px}
.topbar+.life-row{margin:-4px 0 12px}
.hearts{display:flex;gap:3px}
.hearts .h{display:block;width:clamp(15px,4.6vw,20px);height:clamp(14px,4.2vw,18px)}
.hearts svg{width:100%;height:100%;display:block;fill:none;stroke:#4a4a46;stroke-width:1.8}
.hearts .h.on svg{fill:var(--red);stroke:var(--red)}
.life-view small{font-size:11px;color:var(--text2);white-space:nowrap;font-variant-numeric:tabular-nums}
.life-big .hearts{justify-content:center;margin-bottom:4px}
.life-big small{display:block;font-size:11px;color:var(--text2)}
.life-big em{display:block;font-style:normal;font-size:12px;color:var(--red)}

/* ステージ選択 */
.level{border:1px solid var(--border);background:var(--bg1);border-radius:12px;padding:12px;margin-bottom:12px}
.level-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:8px}
.level-head b{font-family:var(--serif);font-size:18px;color:var(--gold);letter-spacing:.08em;white-space:nowrap}
.level-head span{font-size:11px;color:var(--text1);text-align:right}
.stage-grid,.hunt-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stage-btn{aspect-ratio:1;border:1px solid var(--border2);border-radius:8px;background:var(--bg2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:15px;font-weight:600;padding:2px}
.stage-btn small{font-size:9px;font-weight:400;color:var(--text1);line-height:1.2;text-align:center}
.stage-btn.clear{border-color:var(--gold);background:var(--gold-dim)}
.stage-btn.perfect{border-color:var(--gold);background:linear-gradient(160deg,#5a3a08,#2a1a04)}
.stage-btn.locked{opacity:.3;pointer-events:none}
.scroll{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}

/* ゲーム */
#game,#hunt{padding-left:8px;padding-right:8px;height:100dvh}
#select,#howto,#huntSelect,#tutorial,#endlessSelect{height:100dvh}
#endless{padding-left:8px;padding-right:8px;height:100dvh}
.hud{display:flex;align-items:center;gap:8px;padding:0 4px}
.hud .stage-name{font-family:var(--serif);font-size:18px;letter-spacing:.08em;flex:1;min-width:0}
.hud .stage-name small{display:block;font-family:var(--sans);font-size:10px;color:var(--text1);letter-spacing:.05em}
.timer{font-variant-numeric:tabular-nums;font-size:22px;font-weight:600;letter-spacing:.02em;min-width:84px;text-align:right}
.mission{margin:10px 4px 6px;padding:9px 12px;border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:8px;background:var(--bg1);font-size:13px;line-height:1.7;color:var(--text1)}
.mission b{color:var(--text0)}
.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:auto;min-height:0;-webkit-overflow-scrolling:touch}
.board-wrap.zoom{justify-content:flex-start;align-items:flex-start}
.board{width:min(100%,62dvh);aspect-ratio:1;display:block;touch-action:manipulation}
.board-wrap.zoom .board{width:190%;max-width:none;flex:none;touch-action:pan-x pan-y}
.counter{display:flex;justify-content:center;gap:6px;margin:8px 0}
.pip{width:22px;height:8px;border-radius:4px;background:var(--bg3);border:1px solid var(--border2)}
.pip.on{background:var(--gold);border-color:var(--gold)}
.counter-label{text-align:center;font-size:12px;color:var(--text1);min-height:18px}
.counter-label b{color:var(--gold);font-size:15px}
.controls{display:flex;gap:8px;margin-top:8px}
.controls .btn{padding:13px 8px;width:auto;flex:1;white-space:nowrap}
.controls .grow{flex:2}
.countdown{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:96px;color:var(--gold);background:var(--bg0);z-index:5}
.countdown.hidden{display:none}
.hunt-status{display:flex;align-items:center;justify-content:space-between;margin:10px 4px 4px}
.qdots{display:flex;gap:6px}
.qdot{width:26px;height:26px;border-radius:50%;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text2)}
.qdot.done{background:var(--gold);border-color:var(--gold);color:#1a1004;font-weight:700}
.qdot.now{border-color:var(--gold);color:var(--gold)}
#huntMisses{font-size:13px;color:var(--text1)} #huntMisses b{color:var(--red);font-size:16px}
.hunt-hint{text-align:center;font-size:13px;color:var(--text1);margin:4px 0}
.feedback{min-height:34px;display:flex;align-items:center;justify-content:center}
.fb{padding:6px 14px;border-radius:16px;font-size:14px;font-weight:600}
.fb.ok{background:var(--gold-dim);color:var(--gold);border:1px solid var(--gold)}
.fb.ng{background:#221a3a;color:var(--purple);border:1px solid var(--purple)}

/* SVG */
.spoke{stroke:#4a4a46;stroke-width:3;stroke-linecap:round}
.spoke.start{stroke:#8a6a2a}
.bar{stroke:var(--red);stroke-width:var(--bw,4);stroke-linecap:round}
.bar.gone{stroke:#3a3a37;stroke-width:1.5;stroke-dasharray:2 4}
.bar.cut{stroke:#7a2a2a;stroke-width:2.5;stroke-dasharray:4 4}
.bar.hint{stroke:var(--green);stroke-width:5}
.bar.pulse{stroke:var(--gold);stroke-width:6;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.cutmark{fill:var(--gold);font-size:13px;font-weight:700;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.label{fill:var(--text2);font-size:13px;text-anchor:middle;dominant-baseline:central;font-family:var(--serif)}
.label.start{fill:#1a1004;font-weight:700}
.pick circle{fill:var(--bg2);stroke:var(--gold);stroke-width:1.5}
.pick .label{fill:var(--text0);font-weight:700}
.pick.wrong{opacity:.3} .pick.wrong circle{stroke:var(--purple)}
.pick.right circle{fill:var(--gold)} .pick.right .label{fill:#1a1004}
.route{fill:none;stroke:var(--gold);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;filter:url(#glow)}
.route.miss{stroke:var(--purple)}

/* エンドレス */
.btn.endless{border-color:var(--red);color:var(--text0);background:linear-gradient(180deg,#3a1414,#1e0c0c);font-weight:700}
.chips{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
#enN.chips{grid-template-columns:repeat(6,1fr)}
#enT.chips{grid-template-columns:repeat(2,1fr)}
.chip{padding:10px 0;border:1px solid var(--border2);border-radius:8px;background:var(--bg2);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1a1004}
.en-preview{width:min(62%,240px);aspect-ratio:1;display:block;margin:4px auto}
.en-info{text-align:center;font-size:13px;color:var(--text1);line-height:1.8;margin:6px 0 12px}
.en-info b{color:var(--text0)}
#endlessSelect .scroll{padding-bottom:12px}
.timer.warn{color:var(--red)}
.cd-msg{font-size:44px;letter-spacing:.12em}

/* チュートリアル */
.tut-board{width:min(100%,46dvh);aspect-ratio:1;margin:0 auto;display:block}
.tut-card{border:1px solid var(--border2);background:var(--bg1);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.85;color:var(--text1);min-height:128px}
.tut-card b{color:var(--text0)}
.tut-dots{display:flex;justify-content:center;gap:6px;margin:12px 0}
.tut-dots span{width:7px;height:7px;border-radius:50%;background:var(--bg3)}
.tut-dots span.on{background:var(--gold)}
#tutorial .controls{margin-top:auto}
#tutTitle{font-size:16px;white-space:nowrap}

/* モーダル */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:16px;padding-bottom:calc(env(safe-area-inset-bottom) + 16px)}
.modal.active{display:flex}
#nameModal{z-index:25}
.sheet{width:min(100%,440px);max-height:88dvh;overflow:auto;background:var(--bg1);border:1px solid var(--border2);border-radius:16px;padding:20px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sheet h3{font-family:var(--serif);font-size:30px;letter-spacing:.16em;text-align:center;margin-bottom:4px}
.sheet h3.ok{color:var(--gold)}
.sheet h3.ng{color:var(--purple)}
.sheet .sub{text-align:center;font-size:13px;color:var(--text1);margin-bottom:14px;line-height:1.7}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stats.two{grid-template-columns:repeat(2,1fr)}
.stat{background:var(--bg2);border-radius:10px;padding:10px 4px;text-align:center}
.stat span{display:block;font-size:10px;color:var(--text1);letter-spacing:.05em}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
.stat em{display:block;font-style:normal;font-size:10px;color:var(--gold);margin-top:2px}
.life-big{text-align:center;margin:4px 0 12px}
.rank-big{text-align:center;margin-bottom:14px;font-size:13px;color:var(--text1);line-height:1.8}
.rank-big b{font-family:var(--serif);font-size:30px;color:var(--gold);margin:0 4px}
.sheet .btn{margin-top:8px}
.rank-table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 10px}
.rank-table th{font-size:10px;color:var(--text2);font-weight:400;text-align:left;padding:4px 6px;border-bottom:1px solid var(--border)}
.rank-table td{padding:8px 6px;border-bottom:1px solid var(--bg3);font-variant-numeric:tabular-nums}
.rank-table tr.me td{color:var(--gold)}
.rank-table td.r{font-family:var(--serif);font-weight:700;width:34px}
.rank-table td.n{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--text2);font-size:12px;text-align:center;line-height:1.7}
input[type=text]{width:100%;padding:14px;border-radius:10px;border:1px solid var(--border2);background:var(--bg0);color:var(--text0);font-size:17px;user-select:text;-webkit-user-select:text}

/* 遊び方 */
.howto{line-height:1.9;font-size:14px;color:var(--text1)}
.howto h3{font-family:var(--serif);color:var(--text0);font-size:18px;margin:22px 0 4px;padding-bottom:4px;border-bottom:1px solid var(--border);letter-spacing:.08em}
.howto h4{font-family:var(--serif);color:var(--gold);font-size:15px;margin:14px 0 4px;letter-spacing:.08em}
.howto b{color:var(--text0)}
.howto ol,.howto ul{padding-left:1.3em}
.howto .note{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--bg1);margin-top:10px;font-size:13px}
.howto .btn{margin-top:10px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translateX(-50%);background:var(--bg3);border:1px solid var(--border2);padding:10px 16px;border-radius:20px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>

<!-- タイトル -->
<section class="screen active" id="title">
  <div class="lang-switch" role="group" aria-label="Language">
    <button data-lang="ja">日本語</button><button data-lang="en">English</button>
  </div>
  <div>
    <div class="logo-kicker">REAL NEGOTIATION GAME</div>
    <h1 class="logo" data-i18n="logo"></h1>
  </div>
  <svg class="title-svg" id="titleArt" viewBox="-210 -210 420 420" aria-hidden="true"></svg>
  <div class="title-menu">
    <button class="btn primary" id="goCut" data-i18n="goCut"></button>
    <button class="btn primary" id="goHunt" data-i18n="goHunt"></button>
    <button class="btn endless" id="goEndless" data-i18n="goEndless"></button>
    <div class="row">
      <button class="btn" data-go="howto" data-i18n="howtoBtn"></button>
      <button class="btn" id="btnName"><span data-i18n="nameLbl"></span><span id="nameLabel"></span></button>
    </div>
  </div>
  <p class="credit serif"><span data-i18n="credit"></span><br><a id="eventLink" target="_blank" rel="noopener" data-i18n="eventLink"></a></p>
</section>

<!-- 削除モード: ステージ選択 -->
<section class="screen" id="select">
  <div class="topbar"><button class="back" data-go="title">‹</button><h2 data-i18n="cutTitle"></h2><span class="muted" id="clearCount"></span></div>
  <div class="life-row life-view"></div>
  <div class="scroll" id="levelList"></div>
</section>

<!-- 削除モード: ゲーム -->
<section class="screen" id="game">
  <div class="hud">
    <button class="back" id="quit">‹</button>
    <div class="stage-name" id="stageName"></div>
    <button class="btn small" id="zoomBtn"></button>
  </div>
  <div class="life-row life-view"></div>
  <div class="mission" id="mission"></div>
  <div class="board-wrap" id="boardWrap">
    <svg class="board" id="board" viewBox="-215 -215 430 430"></svg>
    <div class="countdown hidden" id="countdown"></div>
  </div>
  <div class="counter" id="pips"></div>
  <div class="counter-label" id="counterLabel"></div>
  <div class="controls">
    <button class="btn" id="resetBtn" data-i18n="reset"></button>
    <div class="timer" id="timer">0.00</div>
    <button class="btn primary grow" id="submitBtn"></button>
  </div>
</section>

<!-- スタート探しモード: ステージ選択 -->
<section class="screen" id="huntSelect">
  <div class="topbar"><button class="back" data-go="title">‹</button><h2 data-i18n="huntTitle"></h2><span class="muted" id="huntClearCount"></span></div>
  <div class="life-row life-view"></div>
  <div class="scroll" id="huntList"></div>
</section>

<!-- スタート探しモード: ゲーム -->
<section class="screen" id="hunt">
  <div class="hud">
    <button class="back" id="huntQuit">‹</button>
    <div class="stage-name" id="huntName"></div>
    <button class="btn small" id="huntZoom"></button>
    <div class="timer" id="huntTimer">0.00</div>
  </div>
  <div class="life-row life-view"></div>
  <div class="hunt-status"><div class="qdots" id="huntProgress"></div><div id="huntMisses"></div></div>
  <p class="hunt-hint" data-i18n="huntHint"></p>
  <div class="board-wrap" id="huntWrap">
    <svg class="board" id="huntBoard" viewBox="-215 -215 430 430"></svg>
    <div class="countdown hidden" id="huntCountdown"></div>
  </div>
  <div class="feedback" id="huntFeedback"></div>
</section>

<!-- エンドレスチャレンジ: サイズ選択 -->
<section class="screen" id="endlessSelect">
  <div class="topbar"><button class="back" data-go="title">‹</button><h2 data-i18n="endlessTitle"></h2></div>
  <div class="life-row life-view"></div>
  <div class="scroll">
    <div class="level"><div class="level-head"><b data-i18n="enType"></b><span data-i18n="enTypeSub"></span></div><div class="chips" id="enT"></div></div>
    <div class="level"><div class="level-head"><b data-i18n="spokes"></b><span data-i18n="spokesSub"></span></div><div class="chips" id="enN"></div></div>
    <div class="level"><div class="level-head"><b data-i18n="rungs"></b><span data-i18n="rungsSub"></span></div><div class="chips" id="enR"></div></div>
    <svg class="en-preview" id="enPreview" viewBox="-215 -215 430 430"></svg>
    <p class="en-info" id="enInfo"></p>
    <button class="btn primary" id="enStart" data-i18n="enStart"></button>
    <button class="btn" id="enRank" style="margin-top:8px" data-i18n="enRank"></button>
  </div>
</section>

<!-- エンドレスチャレンジ: ゲーム -->
<section class="screen" id="endless">
  <div class="hud">
    <button class="back" id="enQuit">‹</button>
    <div class="stage-name" id="enName"></div>
    <button class="btn small" id="enZoom"></button>
    <div class="timer" id="enTimer">2:00.0</div>
  </div>
  <div class="life-row life-view"></div>
  <div class="mission" id="enMission"></div>
  <div class="board-wrap" id="enWrap">
    <svg class="board" id="enBoard" viewBox="-215 -215 430 430"></svg>
    <div class="countdown hidden" id="enCountdown"></div>
  </div>
  <div class="counter" id="enPips"></div>
  <div class="counter-label" id="enLabel"></div>
  <div class="controls" id="enControls">
    <button class="btn" id="enReset" data-i18n="reset"></button>
    <button class="btn primary grow" id="enSubmit"></button>
